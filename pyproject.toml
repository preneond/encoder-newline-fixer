[project]
name = "newlinefix"
version = "0.1.0"
description = "ML service that fixes newline placement in English text"
readme = "README.md"
authors = [
    { name = "Ondrej Prenek", email = "ondra.prenek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
python = "./.venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
