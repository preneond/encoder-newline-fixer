# Full stack: the FastAPI service plus a Streamlit UI that talks to it over HTTP.
#   docker compose up   # UI on http://localhost:8501, API on http://localhost:8000
#
# No model is baked into the API image: on first boot it downloads the published
# checkpoint from the Hugging Face Hub (see the Dockerfile header), hence the
# generous healthcheck start_period.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      # The image has no curl; python is always there via the uv base image.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      # Set => the UI runs in remote mode: a single "api" model, fixed over HTTP.
      NEWLINEFIX_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
